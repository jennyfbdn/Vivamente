<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | VivaMente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- CABEÇALHO E MENU -->
    <header class="cabecalho">
        <nav class="container menu">
            <a class="marca" href="index.html">VivaMente</a>
            <div class="links-menu">
                <a class="menu-link" href="como-funciona.html">Como Funciona</a>
                <a class="menu-link" href="resultados.html">Psicólogos</a>
                <a class="menu-link" href="sobre-nos.html">Sobre nós</a>

                <a class="menu-link" href="cadastro.html">Criar Conta</a>
            </div>
        </nav>
    </header>


    <!-- FORMULÁRIO DE ENTRADA -->
    <main class="conteudo container">
        <section class="caixa formulario">
            <h1 class="text-center">Entre na VivaMente</h1>
            <form>
                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>
                <div class="mb-3">
                    <label for="senha" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="senha" name="senha" required>
                </div>
                <button type="submit" class="btn botao-verde w-100">Entrar</button>
            </form>
            <br>
            <p class="text-center">Não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
        </section>
    </main>

    <!-- RODAPÉ -->
    <footer class="rodape">
        <p>© 2026 VivaMente — Projeto acadêmico.</p>
        <p>Plataforma demonstrativa desenvolvida para fins educacionais.</p>
    </footer>
</body>
